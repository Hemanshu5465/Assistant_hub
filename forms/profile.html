<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../config.js"></script>
    <title>My Profile - Ai Assistant Hub</title>
    <link rel="stylesheet" href="../notifications.css">
    <script src="../notifications.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            80% {
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            padding-top: 80px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* Center horizontally if content is less than viewport width */
        }

        .profile-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn:hover {
            transform: translateX(-5px);
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Header Card */
        .profile-header {
            background: rgba(30, 41, 59, 0.7);
            /* Dark Glass */
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .profile-header:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            opacity: 0.8;
        }

        /* AVATAR */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-size: 3.5rem;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s backwards, pulseGlow 2s infinite;
            border: 4px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .edit-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .avatar-container:hover .edit-overlay {
            opacity: 1;
        }

        .edit-icon {
            color: white;
            font-size: 1.5rem;
        }

        /* INFO */
        .info {
            animation: slideIn 0.6s ease-out 0.4s backwards;
        }

        .info h1 {
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .info p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Stats Grid */
        h2 {
            margin-bottom: 25px;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.6s forwards;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .stat-card {
            background: var(--card-dark);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            /* JS will trigger animation */
            animation: fadeIn 0.5s ease-out forwards;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0.7s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.8s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.9s;
        }

        .stat-card:nth-child(4) {
            animation-delay: 1.0s;
        }

        .stat-card:nth-child(5) {
            animation-delay: 1.1s;
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: #252f45;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* HIDDEN INPUT */
        #fileInput {
            display: none;
        }

        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="profile-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <a href="../index.html" class="back-btn">← Home</a>
            <div style="color: var(--text-muted); font-size: 0.9rem;">Account Settings</div>
        </header>

        <!-- Main Header -->
        <div class="profile-header">
            <div class="avatar-container" onclick="document.getElementById('fileInput').click()">
                <div class="avatar" id="avatarDisplay">
                    <span id="initials">U</span>
                </div>
                <div class="edit-overlay">
                    <span class="edit-icon">📷</span>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*">

            <div class="info">
                <h1 id="userNameDisplay">User Name</h1>
                <p id="userEmailDisplay">user@example.com</p>
                <div class="badge" id="userJoined">Joined: ...</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
            <button class="tab-btn" onclick="switchTab('settings')">Edit Profile</button>
            <button class="tab-btn" onclick="switchTab('security')">Security</button>
        </div>

        <!-- Tab Contents -->
        <div id="overview" class="tab-content active">
            <h2 style="margin-top:0;">Activity Stats</h2>
            <div class="stats-grid" id="statsGrid">
                <!-- JS Populated -->
            </div>
        </div>

        <div id="settings" class="tab-content">
            <h2 style="margin-top:0;">Profile Settings</h2>
            <form id="profileForm" class="settings-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="editEmail" placeholder="your@email.com" required>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>

        <div id="security" class="tab-content">
            <h2 style="margin-top:0;">Security</h2>
            <div class="stat-card" style="text-align: left; opacity: 1; animation: none;">
                <h3 style="color: white; margin-bottom: 10px;">Password</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                    Need to change your password? We can send a reset link to your email.
                </p>
                <button onclick="requestPasswordReset()" class="btn-outline">Send Reset Link</button>
            </div>
        </div>
    </div>

    <style>
        .tabs-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 2px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .tab-btn:hover {
            color: white;
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        .settings-form {
            background: var(--card-dark);
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .save-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-outline {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>

    <script src="profile.js"></script>
</body>

</html>
